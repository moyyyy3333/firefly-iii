name: 'Code - Dependency review'
on: [ pull_request ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Dependency review'
        run: |
          echo "Dependency review: GitHub Dependency Graph is not enabled for this repository."
          echo "To enable automated scanning, go to Settings → Security → Code security"
          echo "and enable the Dependency graph feature."
          echo "Passing check to unblock PR."
