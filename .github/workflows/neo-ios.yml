name: NEO – iOS Build & Submit

on:
  push:
    branches:
      - claude/neo-installation-ready-eZJDV
    paths:
      - 'neo/**'
  workflow_dispatch:          # lets you trigger it manually from GitHub UI

jobs:
  build-and-submit:
    name: Build & Submit to App Store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neo/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Restore App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p secrets
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > secrets/AuthKey_6B83VR88CL.p8
          chmod 600 secrets/AuthKey_6B83VR88CL.p8

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to App Store Connect
        run: eas submit --platform ios --profile production --latest --non-interactive
