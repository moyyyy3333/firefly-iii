name: NEO – iOS Build & Submit

on:
  push:
    branches:
      - claude/neo-installation-ready-eZJDV
    paths:
      - 'neo/**'
  workflow_dispatch:

env:
  EXPO_TOKEN: 5zDGNIZGhouTvUjvInWLPE75TFygXQgriT6Pb0RB
  ASC_API_KEY_P8_BASE64: 
  EAS_NO_VCS: 1

jobs:
  build-and-submit:
    name: Build & Submit to App Store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neo/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Restore App Store Connect API key
        run: |
          mkdir -p secrets
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > secrets/AuthKey_6B83VR88CL.p8
          chmod 600 secrets/AuthKey_6B83VR88CL.p8

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Verify Expo login
        run: npx eas-cli whoami

      - name: Build iOS and submit to App Store Connect
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit
