name: Deploy Unmask

on:
  push:
    branches: [main]
    paths: [filter-removal-web/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: filter-removal-web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: filter-removal-web

      - name: Build
        run: npm run build
        working-directory: filter-removal-web
        env:
          VITE_BASE: /firefly-iii/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: filter-removal-web/dist
          branch: gh-pages
          clean: true
