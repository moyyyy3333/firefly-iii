name: Deploy Unmask to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [filter-removal-web/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        run: npm install --global vercel && vercel deploy --prod --yes
        working-directory: filter-removal-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_bCBlnIFQfzF4chYlXGUzoRcD
          VERCEL_PROJECT_ID: prj_WHEjS2CuT9nGxSnwgO6uyelTqZ0e
